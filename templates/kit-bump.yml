# Keeps this game on the latest game kit. Every hour (or when run by hand) it
# moves the kit pin to game-kit's main, runs this game's check, and merges the
# move if the check passes and no kit change since the last pin is held for
# the owner. Otherwise it leaves the pull request open and says why.
#
# The logic is game-kit's tools/kit-bump.mjs, read from game-kit's main on
# every run, so this file rarely changes. game-kit is public, so the repo's own
# token is all it needs. Two jobs: `check` runs the game's check, with every
# install script, holding a token that can only read; `publish`, on a fresh
# runner, makes the same pin move again without running anything of the
# game's but its sync tool, and is the only job that can write. From `check`
# it takes one file, unpacked into a folder of its own, and believes its
# commit only if it is the one `check` recorded before the check ran.
#
# Copied from game-kit's templates/kit-bump.yml into
# .github/workflows/kit-bump.yml: set the three values under `env`.
#
# The repo must let workflows open pull requests: Settings, Actions, General,
# "Allow GitHub Actions to create and approve pull requests".
name: kit-bump

on:
  schedule:
    - cron: '23 * * * *'
  workflow_dispatch: {}

# One run at a time, never cancelling one in progress.
concurrency:
  group: kit-bump
  cancel-in-progress: false

# Each job asks for what it needs.
permissions: {}

env:
  # The folder that holds this game's tools/ and kit/.
  KIT_ROOT: .
  # The branch this game's work lands on.
  KIT_BRANCH: main
  # How this repo merges pull requests: merge, squash or rebase.
  KIT_MERGE: merge

jobs:
  check:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    permissions:
      contents: read
      pull-requests: read
    outputs:
      kit: ${{ steps.kit.outputs.commit }}
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ env.KIT_BRANCH }}
          persist-credentials: false

      - id: kit
        name: Read game-kit's main
        run: |
          git clone --quiet https://github.com/eladrianovalle/game-kit.git "$RUNNER_TEMP/game-kit"
          echo "commit=$(git -C "$RUNNER_TEMP/game-kit" rev-parse HEAD)" >> "$GITHUB_OUTPUT"

      - id: node
        name: Choose the game's Node version
        run: |
          if [ -f "$KIT_ROOT/.nvmrc" ]; then
            echo "version=$(cat "$KIT_ROOT/.nvmrc")" >> "$GITHUB_OUTPUT"
          else
            echo "version=22" >> "$GITHUB_OUTPUT"
          fi
      - uses: actions/setup-node@v4
        with:
          node-version: ${{ steps.node.outputs.version }}

      - name: Move the kit pin and run the check
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          node "$RUNNER_TEMP/game-kit/tools/kit-bump.mjs" check \
            --game . --root "$KIT_ROOT" --kit "$RUNNER_TEMP/game-kit" \
            --repo "$GITHUB_REPOSITORY" --result "$RUNNER_TEMP/kit-bump-result.json" \
            --summary "$GITHUB_STEP_SUMMARY"

      - uses: actions/upload-artifact@v4
        with:
          name: kit-bump-result
          path: ${{ runner.temp }}/kit-bump-result.json

  publish:
    needs: check
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      contents: write
      pull-requests: write
    env:
      # Recorded by `check` before the game's check ran. The result file's commit must match it.
      KIT_COMMIT: ${{ needs.check.outputs.kit }}
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ env.KIT_BRANCH }}
          persist-credentials: false

      - name: Read game-kit at the commit the check used
        run: |
          git clone --quiet https://github.com/eladrianovalle/game-kit.git "$RUNNER_TEMP/game-kit"
          git -C "$RUNNER_TEMP/game-kit" merge-base --is-ancestor "$KIT_COMMIT" origin/main
          git -C "$RUNNER_TEMP/game-kit" checkout --quiet --detach "$KIT_COMMIT"

      # Into a folder of its own: the check job chose the artifact's contents, so it must not be
      # unpacked over the clone above or anything else this job runs.
      - uses: actions/download-artifact@v4
        with:
          name: kit-bump-result
          path: ${{ runner.temp }}/check-result

      - name: Push the pin move, open its pull request, and merge it or say why not
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          node "$RUNNER_TEMP/game-kit/tools/kit-bump.mjs" publish \
            --game . --root "$KIT_ROOT" --kit "$RUNNER_TEMP/game-kit" --kit-commit "$KIT_COMMIT" \
            --kit-repo eladrianovalle/game-kit --repo "$GITHUB_REPOSITORY" \
            --base "$KIT_BRANCH" --merge "$KIT_MERGE" \
            --result "$RUNNER_TEMP/check-result/kit-bump-result.json" --summary "$GITHUB_STEP_SUMMARY"
